<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plinko — Golden Ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1923; --bg-2:#141f2b; --panel:#1a2733; --panel-2:#213743;
  --border:#2f4553; --border-2:#3d5666;
  --text:#ffffff; --muted:#8a9fb2; --muted-2:#b1bad3;
  --accent:#f0b90b; --accent-2:#ffd54a;
  --green:#00e701; --red:#ff4d4d;
  --radius:12px; --radius-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;font-weight:500;
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, #1e3446 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #16232f 0%, transparent 50%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:800;margin:0;letter-spacing:-0.025em}
.hide{display:none!important}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke-width:1.8}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 24px;
  background:rgba(15,25,35,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-0.02em;text-decoration:none}
.brand-logo{width:24px;height:24px;color:var(--accent);flex-shrink:0}
.brand span{color:var(--text);font-weight:600}
.brand b{color:var(--accent);font-weight:800}
.hgroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted-2);font-weight:600}
.who .icon{width:15px;height:15px;color:var(--muted)}
.bal{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;
  color:var(--muted-2);font-variant-numeric:tabular-nums;
}
.bal .icon{width:15px;height:15px;color:var(--accent)}
.bal span{color:var(--accent-2);font-weight:800}

button{
  font:inherit;font-weight:700;font-size:14px;
  cursor:pointer;border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);color:var(--text);
  padding:10px 16px;transition:.15s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
button:hover:not(:disabled){border-color:var(--border-2);background:var(--panel-2)}
button:disabled{opacity:.4;cursor:not-allowed}
button .icon{width:16px;height:16px}

#game{max-width:1000px;margin:0 auto;padding:22px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
.top h2{color:var(--text);font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.top h2 svg{width:20px;height:20px;color:var(--accent)}

.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

/* BOARD */
.board{
  position:relative;background:var(--panel);
  border:1px solid var(--border-2);border-radius:var(--radius-lg);
  overflow:hidden;height:min(68vh,540px);
  box-shadow:0 20px 40px -20px #000a;
}
#cv{width:100%;height:100%;display:block}
.toast{
  position:absolute;top:10px;left:0;right:0;text-align:center;
  font:800 18px 'Manrope',sans-serif;pointer-events:none;min-height:1.4em;
  text-shadow:0 2px 10px #000a;color:var(--accent-2);
}

/* PANEL */
.ctl{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px;
  display:grid;gap:14px;align-content:start;
}
.grp{display:grid;gap:8px}
.grp>span{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.seg{display:flex;gap:8px}
.seg button,.q{
  flex:1;background:var(--panel-2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 8px;font:700 13px 'Manrope',sans-serif;
  cursor:pointer;transition:.15s;
}
.seg button:hover:not(:disabled),.q:hover:not(:disabled){border-color:var(--border-2);background:var(--panel)}
.seg button.on{
  background:linear-gradient(180deg,var(--accent-2),var(--accent));
  border-color:var(--accent);color:#1a1500;
}
.seg button:disabled{opacity:.4;cursor:not-allowed}
input{
  width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font:700 15px 'Manrope',sans-serif;
  font-variant-numeric:tabular-nums;transition:.15s;
}
input:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
input::placeholder{color:var(--muted);font-weight:500}

#drop{
  width:100%;padding:16px;border-radius:12px;
  background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#1a1500;border:1px solid var(--accent);
  font:800 16px 'Manrope',sans-serif;letter-spacing:.06em;
}
#drop:hover:not(:disabled){filter:brightness(1.08)}
#drop:disabled{opacity:.4;cursor:not-allowed}

#auto.on{background:linear-gradient(180deg,#00e701,#00b800);color:#002a00;border-color:var(--green)}

.hist{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--border);font-weight:700;font-size:12px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.chip.w{color:var(--green);border-color:rgba(0,231,1,.4)}
.chip.l{color:var(--muted)}
.chip.j{color:var(--accent-2);border-color:rgba(240,185,11,.5)}

.foot{
  color:var(--muted);font-size:12px;
  display:flex;justify-content:space-between;gap:8px;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
}

@media(max-width:600px){
  header{padding:12px 16px}
  .brand{font-size:15px}
  #game{padding:16px 12px}
  .ctl{padding:14px}
}
</style></head><body>

<header>
  <a href="/" class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M6 3h12l3 6-9 12L3 9z"/>
      <path d="M3 9h18M9 3l-1 6 4 12M15 3l1 6-4 12"/>
    </svg>
    <span><b>GOLDEN</b> ACE</span>
  </a>
  <div class="hgroup">
    <span class="who">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      <span id="who">—</span>
    </span>
    <div class="bal">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" stroke-dasharray="2 2.5"/>
      </svg>
      <span id="bal">—</span>
    </div>
    <button onclick="logout()">Wyloguj</button>
  </div>
</header>

<main id="game">
<div class="top">
  <a href="/" style="text-decoration:none"><button>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Lobby
  </button></a>
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4" r="1.6"/>
      <circle cx="8" cy="9" r="1.6"/><circle cx="16" cy="9" r="1.6"/>
      <circle cx="4" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/><circle cx="20" cy="14" r="1.6"/>
      <circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/>
    </svg>
    Plinko
  </h2>
  <span style="width:80px"></span>
</div>

<div class="layout">
  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="ctl">
    <div class="grp">
      <span>Rzędy kołków</span>
      <div class="seg" id="rows">
        <button data-v="8">8</button>
        <button data-v="12" class="on">12</button>
        <button data-v="16">16</button>
      </div>
    </div>

    <div class="grp">
      <span>Ryzyko</span>
      <div class="seg" id="risk">
        <button data-v="low">Niskie</button>
        <button data-v="med" class="on">Średnie</button>
        <button data-v="high">Wysokie</button>
      </div>
    </div>

    <div class="grp">
      <span>Stawka za kulkę</span>
      <input id="bet" type="number" min="1" step="1" value="10" inputmode="numeric">
      <div class="seg">
        <button class="q" data-b="10">10</button>
        <button class="q" data-b="50">50</button>
        <button class="q" data-m="0.5">½</button>
        <button class="q" data-m="2">2×</button>
        <button class="q" data-m="max">Max</button>
      </div>
    </div>

    <button id="drop">Zrzuć kulkę</button>

    <div class="seg"><button id="auto">Auto: wyłączone</button></div>

    <div class="hist" id="hist" aria-label="Ostatnie wyniki"></div>

    <div class="foot">
      <span>Spacja = zrzuć kulkę. Możesz mieć w grze wiele kulek naraz. Zwrot gracza: 97%.</span>
    </div>
  </div>
</div>
</main>

<script>
/* ============ API ============ */
const $ = s => document.querySelector(s);
const token = localStorage.getItem('ga_token') || '';
let me = null;

async function api(path, method='GET', body){
  const h = { 'Content-Type':'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  try{
    const r = await fetch(path, { method, headers:h, body: body?JSON.stringify(body):undefined });
    let d = null; try{ d = await r.json(); }catch(e){}
    return { ok:r.ok, status:r.status, data:d };
  }catch(e){ return { ok:false, status:0, data:{ error:'Brak połączenia z serwerem' } }; }
}
async function logout(){
  try{ await api('/api/logout','POST'); }catch(e){}
  localStorage.removeItem('ga_token');
  location.href = '/';
}

/* ============ KONFIG GRY ============ */
const RISK = { low:{ p:2, a:.35 }, med:{ p:3, a:.12 }, high:{ p:4.5, a:.03 } };

/* ============ STAN ============ */
let bal = 0;
let n = 12, risk = 'med';
let hist = [];
let balls = [];
let mults = [];
let flash = {};
let autoOn = false, autoT = 0;
let pendingBets = 0;

/* ============ CANVAS ============ */
const cv = $('#cv'), ctx = cv.getContext('2d'), board = $('#board');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const HOP = 230;

const C = (n,k) => { let r = 1; for (let i=1;i<=k;i++) r = r*(n-k+i)/i; return r; };
const d = k => Math.abs(k - n/2) / (n/2);

function calcMults(rows, rk){
  const p = RISK[rk].p, a = RISK[rk].a;
  const N = rows;
  let sum = 0;
  for (let k=0;k<=N;k++){
    const dd = Math.abs(k - N/2) / (N/2);
    sum += C(N,k) / Math.pow(2, N) * (a + Math.pow(dd, p));
  }
  const s = 0.97 / sum;
  const arr = [];
  for (let k=0;k<=N;k++){
    const dd = Math.abs(k - N/2) / (N/2);
    arr.push(Math.round(s * (a + Math.pow(dd, p)) * 100) / 100);
  }
  return arr;
}
function recalc(){ mults = calcMults(n, risk); }

const fmt = m => m >= 100 ? m.toFixed(0) : m >= 10 ? m.toFixed(1) : m.toFixed(2);
const getBet = () => Math.max(1, Math.floor(parseFloat($('#bet').value) || 0));

/* ============ UI ============ */
function ui(){
  $('#bal').textContent = Number(bal).toLocaleString('pl-PL');
  if (me) $('#who').textContent = me.username;

  $('#hist').innerHTML = hist.slice().reverse().map(x =>
    `<span class="chip ${x>=10?'j':x>=1?'w':'l'}">${fmt(x)}×</span>`
  ).join('');

  const lock = balls.length > 0 || pendingBets > 0;
  document.querySelectorAll('#rows button, #risk button').forEach(b => b.disabled = lock);

  const bet = getBet();
  const available = bal - pendingBets;
  $('#drop').disabled = bet > available;
  $('#drop').textContent = bet > available ? 'Brak żetonów' : `Zrzuć kulkę (${bet})`;
}

/* ============ DROP (server autorytatywny) ============ */
async function drop(){
  const bet = getBet();
  if (bet > bal - pendingBets) return;

  pendingBets += bet;
  ui();

  const reqRows = n, reqRisk = risk;
  const r = await api('/api/plinko/drop', 'POST', { bet, rows: reqRows, risk: reqRisk });

  pendingBets -= bet;

  if (!r.ok){
    if (r.status === 401){ localStorage.removeItem('ga_token'); location.href='/'; return; }
    $('#toast').textContent = r.data?.error || 'Błąd';
    ui();
    return;
  }

  if (r.data?.user){ me = r.data.user; bal = me.balance; }

  const slot = r.data.slot;

  // zbuduj ścieżkę: slot prawych skrętów, reszta lewych, potem przetasuj
  const bits = new Array(reqRows).fill(0);
  for (let i=0;i<slot;i++) bits[i] = 1;
  for (let i=bits.length-1;i>0;i--){
    const j = Math.random() * (i+1) | 0;
    const t = bits[i]; bits[i] = bits[j]; bits[j] = t;
  }

  const mSnap = calcMults(reqRows, reqRisk);

  balls.push({
    bet, bits, slot, t0: performance.now(),
    n: reqRows, m: mSnap,
    win: r.data.win, mult: r.data.mult
  });

  ui();
}

/* ============ GEOMETRIA ============ */
function geom(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const p = 14;
  const dx = (w - 2*p) / (n + 1);
  const slotH = Math.min(34, h * 0.08);
  const top = 36;
  const dy = (h - top - slotH - 18) / (n + 1);
  return {
    w, h, dx, dy, slotH, top,
    cx: w/2,
    pr: Math.max(2.5, Math.min(5, dx * .12)),
    br: Math.max(4, Math.min(8, dx * .2))
  };
}
const pegY = (g, i) => g.top + (i+1) * g.dy;

function waypoint(g, b, j){
  if (j === 0) return { x: g.cx, y: g.top - 12 };
  if (j <= b.n){
    const i = j - 1;
    let k = 0;
    for (let q=0;q<i;q++) k += b.bits[q];
    return {
      x: g.cx + (k + 1 - (i+2)/2) * g.dx,
      y: pegY(g, i) - g.pr - g.br
    };
  }
  return { x: g.cx + (b.slot - b.n/2) * g.dx, y: g.h - g.slotH - g.br - 2 };
}

function resize(){
  const r = cv.getBoundingClientRect(), dp = devicePixelRatio || 1;
  cv.width = r.width * dp; cv.height = r.height * dp;
  ctx.setTransform(dp, 0, 0, dp, 0, 0);
}

/* ============ LĄDOWANIE ============ */
function land(b){
  const m = b.m[b.slot];
  hist.push(m);
  hist = hist.slice(-14);
  flash[b.slot] = performance.now();

  const net = b.win - b.bet;
  const t = $('#toast');
  t.textContent = (net >= 0 ? '+' : '−') + Math.abs(net).toLocaleString('pl-PL') + '  (' + fmt(m) + '×)';
  t.style.color = net > 0 ? css('--green') : net === 0 ? css('--accent-2') : css('--muted-2');
  setTimeout(() => { if (t.textContent) t.textContent = ''; }, 2600);
}

/* ============ PĘTLA ============ */
function frame(now){
  const g = geom();
  ctx.clearRect(0, 0, g.w, g.h);

  // sloty u dołu
  for (let k=0;k<=n;k++){
    const x = g.cx + (k - n/2) * g.dx;
    const y = g.h - g.slotH - 2;
    const sw = g.dx * .9;
    const fl = flash[k] && now - flash[k] < 500 ? 1 - (now - flash[k]) / 500 : 0;
    const dd = Math.abs(k - n/2) / (n/2);
    ctx.fillStyle = `hsl(${185 - dd * 175} 75% ${48 + fl * 20}%)`;
    ctx.beginPath();
    ctx.roundRect(x - sw/2, y + fl * -4, sw, g.slotH, 6);
    ctx.fill();

    ctx.fillStyle = '#10061a';
    ctx.font = `700 ${Math.max(9, Math.min(12, g.dx * .38))}px "Manrope",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fmt(mults[k]), x, y + g.slotH/2 + fl * -4);
  }

  // kołki
  ctx.fillStyle = css('--muted');
  ctx.globalAlpha = .8;
  for (let i=0;i<n;i++){
    for (let j=0;j<i+3;j++){
      ctx.beginPath();
      ctx.arc(g.cx + (j - (i+2)/2) * g.dx, pegY(g, i), g.pr, 0, 7);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // kulki
  balls = balls.filter(b => {
    const e = (now - b.t0) / HOP;
    if (e >= b.n + 1){ land(b); ui(); return false; }

    const j = Math.floor(e), f = e - j;
    const A = waypoint(g, b, j), B = waypoint(g, b, j + 1);
    const lift = j === 0 ? 0 : g.dy * .35;
    const x = A.x + (B.x - A.x) * f;
    const y = A.y + (B.y - A.y) * f - lift * 4 * f * (1 - f);

    ctx.fillStyle = css('--accent-2');
    ctx.shadowColor = css('--accent-2');
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, g.br, 0, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    return true;
  });

  if (autoOn && now - autoT > 650 && getBet() <= bal - pendingBets){
    autoT = now;
    drop();
  } else if (autoOn && getBet() > bal - pendingBets){
    setAuto(false);
  }

  requestAnimationFrame(frame);
}

/* ============ AUTO ============ */
function setAuto(v){
  autoOn = v;
  const a = $('#auto');
  a.classList.toggle('on', v);
  a.textContent = 'Auto: ' + (v ? 'włączone' : 'wyłączone');
}

/* ============ SEGMENTY ============ */
function setSeg(id, fn){
  document.querySelectorAll('#' + id + ' button').forEach(b => {
    b.onclick = () => {
      if (balls.length || pendingBets > 0) return;
      document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      fn(b.dataset.v);
      recalc();
      ui();
    };
  });
}
setSeg('rows', v => n = +v);
setSeg('risk', v => risk = v);

/* ============ QUICK BET ============ */
document.querySelectorAll('.q[data-b], .q[data-m]').forEach(b => {
  b.onclick = () => {
    const s = b.dataset;
    let v = getBet();
    v = s.b ? +s.b : s.m === 'max' ? Math.floor(bal) : Math.max(1, Math.floor(v * +s.m));
    $('#bet').value = Math.max(1, Math.min(v, Math.max(1, Math.floor(bal))));
    ui();
  };
});
$('#bet').oninput = ui;
$('#drop').onclick = drop;
$('#auto').onclick = () => setAuto(!autoOn);

addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT/.test(document.activeElement.tagName)){
    e.preventDefault();
    drop();
  }
});
addEventListener('resize', resize);

/* ============ ODSWIEZANIE SALDA ============ */
async function refreshMe(){
  if (!token) return;
  if (balls.length > 0 || pendingBets > 0) return; // nie nadpisuj w trakcie rundy
  try {
    const r = await api('/api/me');
    if (!r.ok){
      if (r.status === 401){ localStorage.removeItem('ga_token'); location.href = '/'; }
      return;
    }
    if (!r.data?.user) return;
    me = r.data.user;
    bal = me.balance;
    ui();
  } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshMe();
});
window.addEventListener('focus', refreshMe);
window.addEventListener('pageshow', e => { if (e.persisted) refreshMe(); });

/* ============ START ============ */
(async function(){
  if (!token){ location.href = '/'; return; }
  const r = await api('/api/me');
  if (!r.ok || !r.data?.user){
    localStorage.removeItem('ga_token');
    location.href = '/';
    return;
  }
  me = r.data.user;
  bal = me.balance;
  recalc();
  resize();
  ui();
  requestAnimationFrame(frame);
})();
</script></body></html>
