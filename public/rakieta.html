<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rakieta — Golden Ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1923; --bg-2:#141f2b; --panel:#1a2733; --panel-2:#213743;
  --border:#2f4553; --border-2:#3d5666;
  --text:#ffffff; --muted:#8a9fb2; --muted-2:#b1bad3;
  --accent:#f0b90b; --accent-2:#ffd54a;
  --green:#00e701; --red:#ff4d4d;
  --radius:12px; --radius-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;font-weight:500;
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, #1e3446 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #16232f 0%, transparent 50%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:800;margin:0;letter-spacing:-0.025em}
.hide{display:none!important}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke-width:1.8}

header{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 24px;
  background:rgba(15,25,35,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-0.02em;text-decoration:none}
.brand-logo{width:24px;height:24px;color:var(--accent);flex-shrink:0}
.brand span{color:var(--text);font-weight:600}
.brand b{color:var(--accent);font-weight:800}
.hgroup{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted-2);font-weight:600}
.who .icon{width:15px;height:15px;color:var(--muted)}
.bal{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;
  color:var(--muted-2);font-variant-numeric:tabular-nums;
}
.bal .icon{width:15px;height:15px;color:var(--accent)}
.bal span{color:var(--accent-2);font-weight:800}

button{
  font:inherit;font-weight:700;font-size:14px;
  cursor:pointer;border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);color:var(--text);
  padding:10px 16px;transition:.15s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
button:hover:not(:disabled){border-color:var(--border-2);background:var(--panel-2)}
button:disabled{opacity:.4;cursor:not-allowed}
button .icon{width:16px;height:16px}

#game{max-width:960px;margin:0 auto;padding:22px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
.top h2{color:var(--text);font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.top h2 svg{width:20px;height:20px;color:var(--accent)}

/* Historia */
.hist{display:flex;gap:6px;overflow-x:auto;padding:0 0 4px;min-height:32px;margin-bottom:14px}
.hist::-webkit-scrollbar{height:4px}
.hist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chip{flex:none;padding:5px 11px;border-radius:99px;border:1px solid var(--border);font-weight:700;font-size:13px;background:var(--panel);font-variant-numeric:tabular-nums}
.chip.lo{color:var(--red)}
.chip.mid{color:var(--green)}
.chip.hi{color:var(--accent-2);border-color:rgba(240,185,11,.5)}

/* Scena */
.stage{
  position:relative;background:var(--panel);
  border:1px solid var(--border-2);border-radius:var(--radius-lg);
  overflow:hidden;height:min(52vh,380px);
  box-shadow:0 20px 40px -20px #000a;
}
#cv{width:100%;height:100%;display:block}
.big{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
#mult{font:800 clamp(40px,12vw,84px) 'Manrope',sans-serif;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 2px 12px #000a}
#sub{color:var(--muted-2);min-height:1.4em;font-size:14px;margin-top:6px;font-weight:600}
.stage.fly #mult{color:var(--accent-2);text-shadow:0 0 20px rgba(240,185,11,.4)}
.stage.crash #mult{color:var(--red);text-shadow:0 0 20px rgba(255,77,77,.4)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-top:16px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px;text-align:left}
label{color:var(--muted);font-size:11px;flex:1 1 160px;display:grid;gap:6px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
input{
  width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font:700 15px 'Manrope',sans-serif;
  font-variant-numeric:tabular-nums;transition:.15s;
}
input:focus{outline:none;border-color:var(--accent);background:var(--bg-2)}
input::placeholder{color:var(--muted);font-weight:500}
.quicks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.q{
  background:var(--panel-2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;font:700 13px 'Manrope',sans-serif;
  cursor:pointer;transition:.15s;
}
.q:hover{border-color:var(--border-2);background:var(--panel)}
#go{
  width:100%;padding:16px;border-radius:12px;
  background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#1a1500;border:1px solid var(--accent);
  font:800 16px 'Manrope',sans-serif;letter-spacing:.06em;
  cursor:pointer;transition:.15s;
}
#go:hover:not(:disabled){filter:brightness(1.08)}
#go:disabled{opacity:.4;cursor:not-allowed}
#go.cash{
  background:linear-gradient(180deg,#00e701,#00b800);
  border-color:var(--green);color:#002a00;
}
.foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);text-align:left}

@media(max-width:600px){
  header{padding:12px 16px}
  .brand{font-size:15px}
  #game{padding:16px 12px}
  .panel{padding:14px}
}
</style></head><body>

<header>
  <a href="/" class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M6 3h12l3 6-9 12L3 9z"/>
      <path d="M3 9h18M9 3l-1 6 4 12M15 3l1 6-4 12"/>
    </svg>
    <span><b>GOLDEN</b> ACE</span>
  </a>
  <div class="hgroup">
    <span class="who">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      <span id="who">—</span>
    </span>
    <div class="bal">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" stroke-dasharray="2 2.5"/>
      </svg>
      <span id="bal">—</span>
    </div>
    <button onclick="logout()">Wyloguj</button>
  </div>
</header>

<main id="game">
<div class="top">
  <a href="/" style="text-decoration:none"><button>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Lobby
  </button></a>
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4-4 3 3 7-7"/>
      <path d="M14 5h5v5"/>
      <path d="M5 20a3 3 0 0 1-3-3c0-2 3-5 3-5s3 3 3 5a3 3 0 0 1-3 3z"/>
    </svg>
    Rakieta
  </h2>
  <span style="width:80px"></span>
</div>

<div class="hist" id="hist" aria-label="Ostatnie rundy"></div>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="big">
    <div id="mult">1.00×</div>
    <div id="sub"></div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label>Stawka
      <input id="bet" type="number" min="1" step="1" value="10" inputmode="numeric">
    </label>
    <label>Auto-wypłata przy ×
      <input id="auto" type="number" min="1.01" step="0.1" placeholder="wyłączona" inputmode="decimal">
    </label>
  </div>
  <div class="quicks">
    <button class="q" data-b="10">+10</button>
    <button class="q" data-b="50">50</button>
    <button class="q" data-b="100">100</button>
    <button class="q" data-m="0.5">½</button>
    <button class="q" data-m="2">2×</button>
    <button class="q" data-m="max">Max</button>
  </div>
  <button id="go">Postaw</button>
  <div class="foot">
    <span>Spacja = postaw / wypłać. Im dłużej lecisz, tym więcej wygrywasz — ale rakieta może wybuchnąć w każdej chwili.</span>
  </div>
</div>
</main>

<script>
/* ============ API ============ */
const $ = s => document.querySelector(s);
const token = localStorage.getItem('ga_token') || '';
let me = null;

async function api(path, method='GET', body){
  const h = { 'Content-Type':'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  try{
    const r = await fetch(path, { method, headers:h, body: body?JSON.stringify(body):undefined });
    let d = null; try{ d = await r.json(); }catch(e){}
    return { ok:r.ok, status:r.status, data:d };
  }catch(e){ return { ok:false, status:0, data:{ error:'Brak połączenia z serwerem' } }; }
}
async function logout(){
  try{ await api('/api/logout','POST'); }catch(e){}
  localStorage.removeItem('ga_token');
  location.href = '/';
}

/* ============ STAN GRY ============ */
let bal = 0;
let history = [];
let state = 'wait', waitEnd = 0, t0 = 0, crashAt = 1, mult = 1,
    bet = 0, placed = false, cashed = false, msg = '';

const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage'),
      go = $('#go'), betEl = $('#bet'), autoEl = $('#auto');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K = 0.12;
const m_at = t => Math.exp(K * t);

function newCrash(){
  const r = Math.random();
  return Math.min(1000, Math.max(1, Math.floor(97/(1-r))/100));
}
function getBet(){
  return Math.max(1, Math.floor(parseFloat(betEl.value) || 0));
}

function startWait(){
  state='wait';
  waitEnd = performance.now() + 5000;
  mult = 1; placed = false; cashed = false; msg = '';
  stage.className = 'stage';
  ui();
}
function startFly(){
  state = 'fly';
  crashAt = newCrash();
  t0 = performance.now();
  stage.className = 'stage fly';
  ui();
}

async function crash(){
  state = 'crash';
  mult = crashAt;
  history.push(crashAt);
  history = history.slice(-30);
  const lost = placed && !cashed;
  msg = lost ? ('Przegrana −' + bet) : (placed ? msg : '');
  stage.className = 'stage crash';
  stage.classList.add('shake');
  ui();

  if (lost){
    const r = await api('/api/crash/settle', 'POST', { bet, payout: 0 });
    if (r.ok && r.data?.user){ me = r.data.user; bal = me.balance; ui(); }
    else if (r.status === 401){ localStorage.removeItem('ga_token'); location.href='/'; return; }
  }
  setTimeout(startWait, 3000);
}

async function cashOut(m){
  if (!placed || cashed) return;
  cashed = true;
  const win = Math.floor(bet * m);
  bal += win;
  msg = 'Wygrana +' + (win - bet) + ' (' + m.toFixed(2) + '×)';
  ui();

  const r = await api('/api/crash/settle', 'POST', { bet, payout: win });
  if (r.ok && r.data?.user){ me = r.data.user; bal = me.balance; ui(); }
  else if (r.status === 401){ localStorage.removeItem('ga_token'); location.href='/'; return; }
}

function press(){
  if (state === 'wait'){
    if (!placed){
      const b = getBet();
      if (b > bal) return;
      bet = b; bal -= b; placed = true;
    } else {
      bal += bet; placed = false;
    }
    ui();
  } else if (state === 'fly' && placed && !cashed){
    cashOut(mult);
  }
}

function ui(){
  $('#bal').textContent = Number(bal).toLocaleString('pl-PL');
  $('#hist').innerHTML = history.slice().reverse().map(x =>
    `<span class="chip ${x>=10?'hi':x>=2?'mid':'lo'}">${x.toFixed(2)}×</span>`
  ).join('');

  go.className = '';
  go.disabled = false;
  if (state === 'wait'){
    go.textContent = placed
      ? `Anuluj zakład (${bet})`
      : (bal < 1 ? 'Brak żetonów' : `Postaw ${getBet()}`);
    go.disabled = !placed && getBet() > bal;
  } else if (state === 'fly'){
    if (placed && !cashed){
      go.className = 'cash';
      go.textContent = 'Wypłać ' + Math.floor(bet * mult);
    } else {
      go.textContent = cashed ? 'Wypłacono' : 'Czekaj na kolejną rundę';
      go.disabled = true;
    }
  } else {
    go.textContent = 'Rakieta wybuchła';
    go.disabled = true;
  }
  $('#sub').textContent = state === 'wait' ? '' : msg;
}

/* ============ CANVAS ============ */
function resize(){
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);

function draw(){
  const w = cv.clientWidth, h = cv.clientHeight, p = 24;
  const T = state === 'wait' ? 0 : Math.log(mult)/K;
  ctx.clearRect(0, 0, w, h);

  const Tm = Math.max(8, T*1.15), Ym = Math.max(2, mult*1.2);
  const X = t => p + (w - 2*p) * t / Tm;
  const Y = m => h - p - (h - 2*p) * (m - 1) / (Ym - 1);

  ctx.strokeStyle = css('--border'); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 5; i++){
    const y = p + (h - 2*p) * i / 5;
    ctx.moveTo(p, y); ctx.lineTo(w - p, y);
  }
  ctx.stroke();

  if (state === 'wait') return;

  const col = state === 'crash' ? css('--red') : css('--accent-2');
  const n = 80;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(1));
  for (let i = 1; i <= n; i++){
    const t = T * i / n;
    ctx.lineTo(X(t), Y(m_at(t)));
  }
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.lineTo(X(T), Y(1)); ctx.lineTo(X(0), Y(1));
  ctx.globalAlpha = .12; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;

  const x = X(T), y = Y(mult), dt = .05;
  const ang = Math.atan2(Y(m_at(T+dt)) - y, X(T+dt) - x);
  ctx.save();
  ctx.translate(x, y);
  ctx.font = '30px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === 'crash') ctx.fillText('💥', 0, 0);
  else { ctx.rotate(ang + Math.PI/4); ctx.fillText('🚀', 0, 0); }
  ctx.restore();
}

/* ============ PĘTLA ============ */
function loop(now){
  if (state === 'wait'){
    const left = Math.max(0, waitEnd - now);
    $('#mult').textContent = (left/1000).toFixed(1) + 's';
    $('#sub').textContent = placed ? 'Zakład przyjęty — ' + bet : 'Postaw zakład przed startem';
    if (left <= 0) startFly();
  } else if (state === 'fly'){
    const t = (now - t0) / 1000;
    mult = Math.max(1, m_at(t));
    const a = parseFloat(autoEl.value);
    if (placed && !cashed && a >= 1.01 && mult >= a && a < crashAt) cashOut(a);
    if (mult >= crashAt) crash();
    else {
      $('#mult').textContent = mult.toFixed(2) + '×';
      if (placed && !cashed) go.textContent = 'Wypłać ' + Math.floor(bet * mult);
    }
  }
  if (state === 'crash') $('#mult').textContent = crashAt.toFixed(2) + '×';
  draw();
  requestAnimationFrame(loop);
}

/* ============ INTERAKCJE ============ */
document.querySelectorAll('.q').forEach(b => b.onclick = () => {
  if (placed && state === 'wait') return;
  const d = b.dataset;
  let v = getBet();
  if (d.b) v = +d.b;
  else if (d.m === 'max') v = Math.floor(bal);
  else v = Math.max(1, Math.floor(v * +d.m));
  betEl.value = Math.max(1, Math.min(v, Math.max(1, Math.floor(bal))));
  ui();
});
betEl.oninput = ui;
go.onclick = press;

addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT/.test(document.activeElement.tagName)){
    e.preventDefault();
    press();
  }
});

/* ============ ODSWIEZANIE SALDA ============ */
async function refreshMe(){
  if (!token) return;
  if (placed) return; // nie nadpisuj podczas aktywnego zakładu
  try {
    const r = await api('/api/me');
    if (!r.ok){
      if (r.status === 401){ localStorage.removeItem('ga_token'); location.href = '/'; }
      return;
    }
    if (!r.data?.user) return;
    me = r.data.user;
    bal = me.balance;
    $('#who').textContent = me.username;
    ui();
  } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshMe();
});
window.addEventListener('focus', refreshMe);
window.addEventListener('pageshow', e => { if (e.persisted) refreshMe(); });

/* ============ START ============ */
(async function(){
  if (!token){ location.href = '/'; return; }
  const r = await api('/api/me');
  if (!r.ok || !r.data?.user){
    localStorage.removeItem('ga_token');
    location.href = '/';
    return;
  }
  me = r.data.user;
  bal = me.balance;
  $('#who').textContent = me.username;
  ui();
  resize();
  startWait();
  requestAnimationFrame(loop);
})();
</script></body></html>
